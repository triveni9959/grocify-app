version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: grocify-postgres
    environment:
      POSTGRES_USER: grocify_user
      POSTGRES_PASSWORD: grocify_password
      POSTGRES_DB: grocify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: grocify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning

volumes:
  postgres_data:
  redis_data:
